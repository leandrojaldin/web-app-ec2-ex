<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Mirador · Recepción</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/tabs.css">
  <link rel="stylesheet" href="css/card.css">
  <link rel="stylesheet" href="css/form.css">
  <link rel="stylesheet" href="css/button.css">
  <link rel="stylesheet" href="css/table.css">
  <link rel="stylesheet" href="css/badge.css">
  <link rel="stylesheet" href="css/message.css">
</head>
<body class="page">
  <header class="header">
    <h1 class="header__title">Hotel Mirador</h1>
    <p class="header__subtitle">Sistema de recepción</p>
    <nav class="tabs">
      <button type="button" class="tabs__button tabs__button--active" data-tab="reservations">Reservas</button>
      <button type="button" class="tabs__button" data-tab="rooms">Habitaciones</button>
      <button type="button" class="tabs__button" data-tab="guests">Huéspedes</button>
    </nav>
  </header>

  <main class="page__content">
    <div id="msg" class="message" hidden></div>

    <!-- RESERVAS -->
    <section id="tab-reservations" data-panel>
      <div class="card">
        <h2 class="card__title">Nueva reserva</h2>
        <form id="reservation-form" class="form">
          <label class="form__label">Habitación
            <select class="form__control" name="room_id" id="reservation-room" required></select>
          </label>
          <label class="form__label">Huésped
            <select class="form__control" name="guest_id" id="reservation-guest" required></select>
          </label>
          <label class="form__label">Ingreso
            <input class="form__control" type="date" name="check_in" required>
          </label>
          <label class="form__label">Salida
            <input class="form__control" type="date" name="check_out" required>
          </label>
          <label class="form__label">Personas
            <input class="form__control" type="number" name="guests_count" min="1" value="1" required>
          </label>
          <button type="submit" class="button">Reservar</button>
        </form>
      </div>

      <div class="card">
        <div class="card__header">
          <h2 class="card__title">Reservas</h2>
          <select class="card__filter" aria-label="Filtrar reservas por estado" id="reservation-filter">
            <option value="">Todas</option>
            <option value="confirmed">Confirmadas</option>
            <option value="checked_in">Hospedados</option>
            <option value="checked_out">Finalizadas</option>
            <option value="cancelled">Canceladas</option>
          </select>
        </div>
        <table class="table">
          <thead>
            <tr><th scope="col" class="table__heading">#</th><th scope="col" class="table__heading">Hab.</th><th scope="col" class="table__heading">Huésped</th><th scope="col" class="table__heading">Ingreso</th><th scope="col" class="table__heading">Salida</th><th scope="col" class="table__heading">Noches</th><th scope="col" class="table__heading">Personas</th><th scope="col" class="table__heading">Total (Bs)</th><th scope="col" class="table__heading">Estado</th><th scope="col" class="table__heading">Acciones</th></tr>
          </thead>
          <tbody id="reservations-body"></tbody>
        </table>
      </div>
    </section>

    <!-- HABITACIONES -->
    <section id="tab-rooms" data-panel hidden>
      <div class="card">
        <h2 class="card__title">Nueva habitación</h2>
        <form id="room-form" class="form">
          <label class="form__label">Número <input class="form__control" name="number" required></label>
          <label class="form__label">Tipo
            <select class="form__control" name="type">
              <option value="single">Simple</option>
              <option value="double">Doble</option>
              <option value="family">Familiar</option>
              <option value="suite">Suite</option>
            </select>
          </label>
          <label class="form__label">Precio por noche (Bs) <input class="form__control" type="number" name="price_per_night" min="1" required></label>
          <label class="form__label">Capacidad <input class="form__control" type="number" name="capacity" min="1" value="2" required></label>
          <button type="submit" class="button">Guardar</button>
        </form>
      </div>

      <div class="card">
        <h2 class="card__title">Habitaciones</h2>
        <table class="table">
          <thead><tr><th scope="col" class="table__heading">Número</th><th scope="col" class="table__heading">Tipo</th><th scope="col" class="table__heading">Precio</th><th scope="col" class="table__heading">Capacidad</th><th scope="col" class="table__heading">Estado</th><th scope="col" class="table__heading">Acciones</th></tr></thead>
          <tbody id="rooms-body"></tbody>
        </table>
      </div>
    </section>

    <!-- HUÉSPEDES -->
    <section id="tab-guests" data-panel hidden>
      <div class="card">
        <h2 class="card__title">Nuevo huésped</h2>
        <form id="guest-form" class="form">
          <label class="form__label">Nombre completo <input class="form__control" name="full_name" required></label>
          <label class="form__label">Email <input class="form__control" type="email" name="email" required></label>
          <label class="form__label">Documento <input class="form__control" name="document" required></label>
          <button type="submit" class="button">Guardar</button>
        </form>
      </div>

      <div class="card">
        <h2 class="card__title">Huéspedes</h2>
        <table class="table">
          <thead><tr><th scope="col" class="table__heading">Nombre</th><th scope="col" class="table__heading">Email</th><th scope="col" class="table__heading">Documento</th><th scope="col" class="table__heading">Acciones</th></tr></thead>
          <tbody id="guests-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
