<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Mirador · Recepción</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Hotel Mirador</h1>
    <p class="subtitle">Sistema de recepción</p>
    <nav class="tabs">
      <button type="button" class="active" data-tab="reservations">Reservas</button>
      <button type="button" data-tab="rooms">Habitaciones</button>
      <button type="button" data-tab="guests">Huéspedes</button>
    </nav>
  </header>

  <main class="container">
    <div id="msg" class="msg" hidden></div>

    <!-- RESERVAS -->
    <section id="tab-reservations" class="tab">
      <div class="box">
        <h2>Nueva reserva</h2>
        <form id="reservation-form" class="form">
          <label>Habitación
            <select name="room_id" id="reservation-room" required></select>
          </label>
          <label>Huésped
            <select name="guest_id" id="reservation-guest" required></select>
          </label>
          <label>Ingreso
            <input type="date" name="check_in" required>
          </label>
          <label>Salida
            <input type="date" name="check_out" required>
          </label>
          <label>Personas
            <input type="number" name="guests_count" min="1" value="1" required>
          </label>
          <button type="submit" class="btn">Reservar</button>
        </form>
      </div>

      <div class="box">
        <div class="box-head">
          <h2>Reservas</h2>
          <select id="reservation-filter">
            <option value="">Todas</option>
            <option value="confirmed">Confirmadas</option>
            <option value="checked_in">Hospedados</option>
            <option value="checked_out">Finalizadas</option>
            <option value="cancelled">Canceladas</option>
          </select>
        </div>
        <table>
          <thead>
            <tr><th>#</th><th>Hab.</th><th>Huésped</th><th>Ingreso</th><th>Salida</th><th>Noches</th><th>Personas</th><th>Total (Bs)</th><th>Estado</th><th></th></tr>
          </thead>
          <tbody id="reservations-body"></tbody>
        </table>
      </div>
    </section>

    <!-- HABITACIONES -->
    <section id="tab-rooms" class="tab" hidden>
      <div class="box">
        <h2>Nueva habitación</h2>
        <form id="room-form" class="form">
          <label>Número <input name="number" required></label>
          <label>Tipo
            <select name="type">
              <option value="single">Simple</option>
              <option value="double">Doble</option>
              <option value="family">Familiar</option>
              <option value="suite">Suite</option>
            </select>
          </label>
          <label>Precio por noche (Bs) <input type="number" name="price_per_night" min="1" required></label>
          <label>Capacidad <input type="number" name="capacity" min="1" value="2" required></label>
          <button type="submit" class="btn">Guardar</button>
        </form>
      </div>

      <div class="box">
        <h2>Habitaciones</h2>
        <table>
          <thead><tr><th>Número</th><th>Tipo</th><th>Precio</th><th>Capacidad</th><th>Estado</th><th></th></tr></thead>
          <tbody id="rooms-body"></tbody>
        </table>
      </div>
    </section>

    <!-- HUÉSPEDES -->
    <section id="tab-guests" class="tab" hidden>
      <div class="box">
        <h2>Nuevo huésped</h2>
        <form id="guest-form" class="form">
          <label>Nombre completo <input name="full_name" required></label>
          <label>Email <input type="email" name="email" required></label>
          <label>Documento <input name="document" required></label>
          <button type="submit" class="btn">Guardar</button>
        </form>
      </div>

      <div class="box">
        <h2>Huéspedes</h2>
        <table>
          <thead><tr><th>Nombre</th><th>Email</th><th>Documento</th><th></th></tr></thead>
          <tbody id="guests-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
